name: Build Orbit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Name the artifact
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Orbit-v${VERSION}.apk"
          ls -la dist

      # Deliberately no actions/upload-artifact here: this account's Actions
      # artifact storage quota is full, and release assets are stored
      # separately, so publishing straight to a Release is the reliable path.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.name.outputs.version }}-${{ github.run_number }}
          name: Orbit v${{ steps.name.outputs.version }} (build ${{ github.run_number }})
          files: dist/*.apk
          generate_release_notes: true
